model:
  name: dapier_act_multimodal_dp3head256_resnet18
  hidden_dim: 256
  latent_dim: 32
  chunk_size: 20
  state_dim: 12
  action_dim: 12
  nheads: 8
  encoder_layers: 4
  decoder_layers: 4
  cvae_encoder_layers: 2
  ff_dim: 1024
  dropout: 0.0

point_encoder:
  type: dp3_inspired_global
  mlp_channels: [3, 64, 128, 256]
  layer_norm: true
  activation: relu
  pool: max
  candidate_points: 8192
  num_points: 512
  output_tokens: 1
  fps_space: metric_task_xyz

pointcloud:
  frame: task
  crop:
    x: [0.00, 0.40]
    y: [-0.25, 0.25]
    z: [0.005, 0.30]
  normalization:
    type: dp3_limits_minus_one_to_one
    clipping: false
    stats_file: REQUIRED_FROM_CHECKPOINT

wrist_encoder:
  type: independent_resnet18
  frozen_batch_norm: true
  pretrained_during_training: true
  shared_weights: false
  projection: [512, 256]
  input_hw: [240, 320]
  feature_hw: [8, 10]
  tokens_per_camera: 80
  position_embedding: sine_2d
  source_embedding: learned

rgb:
  channel_order: RGB
  dtype: float32
  range: [0.0, 1.0]
  resize: none
  imagenet_mean_std_normalization: false

context:
  latent_tokens: 1
  qpos_tokens: 1
  head_tokens: 1
  left_wrist_tokens: 80
  right_wrist_tokens: 80
  total_tokens: 163

checkpoint:
  model_type: multimodal_dp3head256_resnet18
  strict_state_dict_load: true
