[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dapier-act"
version = "0.1.0"
description = "Multimodal ACT research scaffold for dual SO-101 manipulation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.1", "torchvision>=0.16", "PyYAML>=6.0"]

[tool.setuptools.packages.find]
include = ["dapier_act*"]
